# Render Blueprint — backend only (frontend deploys to Vercel)
# https://render.com/docs/blueprint-spec

services:
  - type: web
    name: knowcityweather-api
    runtime: node
    # Repo root (package.json delegates to backend/). Dashboard: leave Root Directory empty.
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: "20.18.0"
      - key: NODE_ENV
        value: production
    # Set in Render dashboard: OPENWEATHER_API_KEY, GEMINI_API_KEY,
    # TWILIO_*, USER_WHATSAPP_NUMBER, CITY, PORT (Render sets PORT automatically)
